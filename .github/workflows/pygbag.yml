name: 构建网页版并发布

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 pygbag
        run: pip install pygbag==0.9.3

      - name: 构建网页版
        run: python -m pygbag --build ./

      - name: 首次发布到 gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          force_orphan: true

      - name: 读取 gh-pages 的提交哈希
        run: |
          SHA=$(git ls-remote "https://github.com/${{ github.repository }}" gh-pages | cut -f1)
          echo "拿到哈希: $SHA"
          echo "GH_SHA=$SHA" >> $GITHUB_ENV

      - name: 换用更快的游戏包源并改中文提示
        env:
          REPO: ${{ github.repository }}
        run: |
          echo '' | base64 -d > /tmp/post_build3.py
          python3 /tmp/post_build3.py

      - name: 二次发布（替换后的页面）
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          force_orphan: true
